<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna&#39;s Song Vault</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="bg-gray-100 bg-stone-pattern text-gray-900 font-sans min-h-screen flex flex-col bg-fixed">
    <!-- Common Header -->
    <header class="bg-gray-300 bg-metal-pattern border-b-2 border-gray-400 shadow-md py-4">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-3 text-gray-900 transition-opacity hover:opacity-80 drop-shadow-md">
                <img src="/img/vault.png" alt="Vault Logo" class="h-12 w-auto object-contain">
                <span class="text-2xl font-bold tracking-wide">Anna's Song Vault</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
        
<div class="max-w-4xl mx-auto mt-10">
    <h1 class="text-3xl font-bold text-gray-900 mb-8 text-center drop-shadow-sm">Welcome. Pick an era.</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <a href="/era/uneven-and-odd/" class="block group">
            <div class="bg-gray-200 bg-stone-pattern border border-gray-300 aspect-square rounded-lg flex items-center justify-center text-gray-800 text-2xl font-bold shadow-md transition-all transform group-hover:scale-105 overflow-hidden group-hover:border-gray-500 group-hover:shadow-lg">
                <div class="p-6 text-center">Uneven and odd</div>
            </div>
            <p class="mt-4 text-gray-700 font-medium text-center">My newer songs</p>
        </a>
        
        <a href="/era/a-fraction-of-me-is-irrational/" class="block group">
            <div class="bg-gray-200 bg-stone-pattern border border-gray-300 aspect-square rounded-lg flex items-center justify-center text-gray-800 text-2xl font-bold shadow-md transition-all transform group-hover:scale-105 overflow-hidden group-hover:border-gray-500 group-hover:shadow-lg">
                <div class="p-6 text-center">A fraction of me is irrational</div>
            </div>
            <p class="mt-4 text-gray-700 font-medium text-center">Some of my earlier stuff</p>
        </a>
        
    </div>
</div>

    </main>

    <!-- Common Footer -->
    <footer class="bg-gray-300 bg-metal-pattern text-gray-800 py-6 mt-auto border-t-2 border-gray-400 shadow-inner">
        <div class="max-w-4xl mx-auto px-4 text-left text-sm font-medium">
            <p>&copy; 2026 Anna Kosieradzka.</p>
        </div>
    </footer>
</body>
</html>
