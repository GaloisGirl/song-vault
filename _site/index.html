<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna&#39;s Song Vault</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans min-h-screen flex flex-col bg-fixed">
    <!-- Common Header -->
    <header class="bg-zinc-900 bg-metal-pattern border-b border-zinc-800 shadow-md py-4">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-3 text-zinc-100 transition-opacity hover:opacity-80 drop-shadow-md">
                <img src="/img/vault.png" alt="Vault Logo" class="h-12 w-auto object-contain brightness-75 invert">
                <span class="text-2xl font-bold tracking-wide">Anna's Song Vault</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
        
<div class="max-w-4xl mx-auto mt-10">
    <h1 class="text-3xl font-bold text-zinc-100 mb-8 text-center drop-shadow-sm tracking-wide">Welcome. Pick an era.</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <a href="/era/uneven-and-odd/" class="block group">
            <div class="bg-zinc-800 border-2 border-zinc-700 aspect-square rounded-lg flex items-center justify-center shadow-lg transition-all transform group-hover:scale-105 overflow-hidden group-hover:border-zinc-400 group-hover:shadow-2xl relative group-hover:ring-4 group-hover:ring-zinc-600/50">
                
                <img src="/img/uneven-and-odd.png" alt="Uneven and odd" class="w-full h-full object-cover opacity-90 transition-opacity group-hover:opacity-100 mix-blend-lighten">
                
            </div>
            <p class="mt-4 text-zinc-400 font-medium text-center text-lg">My newer songs</p>
        </a>
        
        <a href="/era/a-fraction-of-me-is-irrational/" class="block group">
            <div class="bg-zinc-800 border-2 border-zinc-700 aspect-square rounded-lg flex items-center justify-center shadow-lg transition-all transform group-hover:scale-105 overflow-hidden group-hover:border-zinc-400 group-hover:shadow-2xl relative group-hover:ring-4 group-hover:ring-zinc-600/50">
                
                <img src="/img/a-fraction-of-me-is-irrational.png" alt="A fraction of me is irrational" class="w-full h-full object-cover opacity-90 transition-opacity group-hover:opacity-100 mix-blend-lighten">
                
            </div>
            <p class="mt-4 text-zinc-400 font-medium text-center text-lg">Some of my earlier stuff</p>
        </a>
        
    </div>
</div>

    </main>

    <!-- Common Footer -->
    <footer class="bg-zinc-900 border-t border-zinc-800 text-zinc-500 py-6 mt-auto">
        <div class="max-w-4xl mx-auto px-4 text-left text-sm font-medium">
            <p>&copy; 2026 Anna Kosieradzka.</p>
        </div>
    </footer>
</body>
</html>
